services:
  web:
    container_name: ${CONTAINER_NAME:-pointvente-app-api}
    image: ${IMAGE_NAME:-pointvente-app-api}:latest
    build: .
    restart: unless-stopped
    # GED et photos des livreurs : hors du conteneur, sinon perdues à chaque redéploiement
    volumes:
      - pointvente-uploads:/app/uploads
    environment:
      - SERVER_PORT=${SERVER_PORT:-8009}
      - PUSH_VAPID_PUBLIC_KEY=${PUSH_VAPID_PUBLIC_KEY:-}
      - PUSH_VAPID_PRIVATE_KEY=${PUSH_VAPID_PRIVATE_KEY:-}
      - PUSH_VAPID_SUBJECT=${PUSH_VAPID_SUBJECT:-https://stock.snisla-errai.me}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://pgsql.prod:5432/pointvente_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-89RQ7kaF7770Qy4343_t8hcjCfsqsKs}
    expose:
      - "${SERVER_PORT:-8009}"
    networks:
      - apps.prod

networks:
  apps.prod:
    external: true

volumes:
  pointvente-uploads:
    name: ${UPLOADS_VOLUME:-pointvente-uploads}

