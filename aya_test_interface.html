<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aya - Assistante Exécutive de M. Mohamed Kardad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --bubble-user: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --bubble-aya: rgba(30, 41, 59, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      color: var(--text-main);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 92vh;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* Header */
    .header {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
    }

    .assistant-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.5);
    }

    .status-dot {
      width: 13px;
      height: 13px;
      background: var(--emerald);
      border: 2px solid var(--bg-dark);
      border-radius: 50%;
      position: absolute;
      bottom: -2px;
      right: -2px;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .kardad-badge {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #a5b4fc;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Chat Messages Box */
    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .messages-container::-webkit-scrollbar {
      width: 6px;
    }
    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .message {
      max-width: 80%;
      padding: 1rem 1.25rem;
      border-radius: 22px;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.25s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }

    .message.aya {
      align-self: flex-start;
      background: var(--bubble-aya);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 6px;
    }

    .audio-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      opacity: 0.85;
    }

    .replay-btn {
      margin-top: 0.65rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 0.4rem 0.85rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }
    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--accent);
      color: white;
    }

    /* Speaking Visualizer */
    .speaking-indicator {
      display: none;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.85rem;
      color: #c084fc;
      padding: 0.5rem 1rem;
      border-radius: 12px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.25);
      align-self: center;
      margin-bottom: 0.5rem;
    }
    .speaking-indicator.active {
      display: flex;
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 18px;
    }
    .wave-bars span {
      width: 3px;
      height: 6px;
      background: #c084fc;
      border-radius: 2px;
      animation: wave 1s infinite alternate ease-in-out;
    }
    .wave-bars span:nth-child(1) { animation-delay: 0.1s; }
    .wave-bars span:nth-child(2) { animation-delay: 0.25s; }
    .wave-bars span:nth-child(3) { animation-delay: 0.4s; }
    .wave-bars span:nth-child(4) { animation-delay: 0.55s; }
    @keyframes wave {
      0% { height: 4px; }
      100% { height: 18px; }
    }

    /* Input Bar */
    .input-bar-container {
      padding: 1.25rem 1.75rem;
      background: rgba(15, 23, 42, 0.65);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mic-button {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .mic-button:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .mic-button.recording {
      background: #ef4444;
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .text-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 0.95rem 1.25rem;
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .send-button {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      border: none;
      background: var(--accent-gradient);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
      flex-shrink: 0;
      box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
    }
    .send-button:hover {
      transform: translateY(-2px);
    }
    .send-button:active {
      transform: translateY(0);
    }

    .recording-timer {
      font-size: 0.85rem;
      color: #ef4444;
      font-weight: 600;
      display: none;
    }
    .recording-timer.active {
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="assistant-profile">
        <div class="avatar-wrapper">
          <div class="avatar">A</div>
          <div class="status-dot"></div>
        </div>
        <div class="title-group">
          <h1>Aya</h1>
          <p>Assistante Personnelle & Exécutive (Voix Gemini Aoede)</p>
        </div>
      </div>
      <div class="kardad-badge">
        <span>👤</span> M. Mohamed Kardad
      </div>
    </header>

    <!-- Messages Container -->
    <div class="messages-container" id="chat">
      <div class="message aya">
        <div class="msg-content">Salam Si Mohamed ! Marhba bik. Ana Aya, l'assistante personnelle dialek. Kifech n9ed n3awnek lyoma ?</div>
      </div>
    </div>

    <!-- Vocal Visualizer Indicator -->
    <div class="speaking-indicator" id="speakingIndicator">
      <div class="wave-bars">
        <span></span><span></span><span></span><span></span>
      </div>
      <span>Aya vous répond (Voix Gemini)...</span>
    </div>

    <!-- Input Bar -->
    <div class="input-bar-container">
      <button class="mic-button" id="micBtn" title="Maintenir ou cliquer pour parler (Darija / FR)">
        🎙️
      </button>
      <span class="recording-timer" id="recordTimer">00:00</span>
      <input 
        type="text" 
        class="text-input" 
        id="textInput" 
        placeholder="Écrivez ou envoyez un vocal en Darija / Français..." 
        autocomplete="off"
      />
      <button class="send-button" id="sendBtn" title="Envoyer">
        ➔
      </button>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = 'http://169.58.118.77:5678/webhook/aya-assistant';
    const USER_ID = 'mohamed-kardad';

    const chat = document.getElementById('chat');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const recordTimer = document.getElementById('recordTimer');
    const speakingIndicator = document.getElementById('speakingIndicator');

    let currentAudio = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let timerInterval = null;
    let seconds = 0;

    // JOUER DIRECTEMENT L'AUDIO GEMINI REÇU
    function playGeminiAudio(base64Data, mimeType = 'audio/wav') {
      if (!base64Data) return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      currentAudio = new Audio(`data:${mimeType};base64,${base64Data}`);
      speakingIndicator.classList.add('active');

      currentAudio.onended = () => {
        speakingIndicator.classList.remove('active');
      };
      currentAudio.onerror = (e) => {
        console.error("Erreur lecture audio Gemini:", e);
        speakingIndicator.classList.remove('active');
      };

      currentAudio.play().catch(err => {
        console.warn("Autoplay restreint par le navigateur, clic nécessaire:", err);
        speakingIndicator.classList.remove('active');
      });
    }

    function addMessage(text, sender, isAudio = false, audioBase64 = null, mimeType = 'audio/wav') {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      
      if (isAudio && sender === 'user') {
        msg.innerHTML = `<div class="audio-tag">🎙️ Note Vocale</div><div class="msg-content">${text}</div>`;
      } else if (sender === 'aya') {
        let replayHtml = '';
        if (audioBase64) {
          replayHtml = `<button class="replay-btn">🔊 Réécouter Aya</button>`;
        }
        const formattedText = text.replace(/(https?:\/\/[^\s]+)/g, (url) => {
          if (url.includes('rapport-pdf') || url.includes('.pdf')) {
            return `<br/><a href="${url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#0284c7;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px;margin-top:8px;box-shadow:0 2px 8px rgba(2,132,199,0.3)">📄 Ouvrir & Télécharger le PDF</a>`;
          }
          return `<a href="${url}" target="_blank" style="color:#38bdf8;text-decoration:underline;">${url}</a>`;
        });
        msg.innerHTML = `<div class="msg-content">${formattedText}</div>${replayHtml}`;
        
        if (audioBase64) {
          msg.querySelector('.replay-btn').addEventListener('click', () => {
            playGeminiAudio(audioBase64, mimeType);
          });
          // Jouer sur-le-champ !
          playGeminiAudio(audioBase64, mimeType);
        }
      } else {
        msg.innerHTML = `<div class="msg-content">${text}</div>`;
      }

      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
      return msg;
    }

    // Envoi Texte
    async function sendTextMessage() {
      const text = textInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      textInput.value = '';

      const waitingMsg = addMessage("Aya prépare sa réponse vocale...", 'aya');

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, userId: USER_ID })
        });
        
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        
        waitingMsg.remove();
        addMessage(
          data.reply || "Marhba Si Mohamed, kolchi mriguel.",
          'aya',
          false,
          data.audioBase64,
          data.mimeType || 'audio/wav'
        );
      } catch (err) {
        console.error(err);
        waitingMsg.remove();
        addMessage("Désolé Si Mohamed, une erreur de communication est survenue. Vérifiez la connexion à n8n.", 'aya');
      }
    }

    sendBtn.addEventListener('click', sendTextMessage);
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendTextMessage();
    });

    // Enregistrement Audio Micro
    micBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              sampleRate: 44100
            } 
          });
          
          let mimeType = 'audio/webm';
          if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
          else if (MediaRecorder.isTypeSupported('audio/wav')) mimeType = 'audio/wav';

          mediaRecorder = new MediaRecorder(stream, { mimeType });
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            sendAudioMessage(audioBlob);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start(250);
          isRecording = true;
          micBtn.classList.add('recording');
          recordTimer.classList.add('active');
          seconds = 0;
          timerInterval = setInterval(() => {
            seconds++;
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            recordTimer.textContent = `${m}:${s}`;
          }, 1000);
        } catch (err) {
          alert("Erreur micro : " + err.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        recordTimer.classList.remove('active');
        clearInterval(timerInterval);
        recordTimer.textContent = '00:00';
      }
    });

    // Envoyer le fichier audio à n8n (Groq Whisper -> Aya -> Gemini TTS)
    async function sendAudioMessage(blob) {
      const userBubble = addMessage("Enregistrement vocal envoyé, analyse en cours...", 'user', true);
      const waitingBubble = addMessage("Aya écoute et prépare sa réponse...", 'aya');

      const formData = new FormData();
      formData.append('audio', blob, 'recording.mp3');
      formData.append('userId', USER_ID);

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);

        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData,
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        // Mettre à jour la bulle utilisateur avec la vraie transcription Groq
        if (data.transcription) {
          const contentDiv = userBubble.querySelector('.msg-content');
          if (contentDiv) contentDiv.textContent = data.transcription;
        }

        waitingBubble.remove();
        // Afficher la réponse et JOUER SUR-LE-CHAMP LA VOIX GEMINI
        addMessage(
          data.reply || "Marhba Si Mohamed, j'ai bien reçu votre message.",
          'aya',
          false,
          data.audioBase64,
          data.mimeType || 'audio/wav'
        );
      } catch (err) {
        console.error(err);
        waitingBubble.remove();
        addMessage("Désolé Si Mohamed, l'audio n'a pas pu être traité. Réessayez.", 'aya');
      }
    }
  </script>
</body>
</html>
